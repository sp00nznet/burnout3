# Burnout 3: Takedown options: every key at its stock value. The game reads
# this file on each launch, beside its executable; it is never copied, and
# an update replaces it, so new keys and defaults reach you. Do not edit
# it: put the keys you change in config/config.toml (copy a line from
# here), which the game creates with a short comment the first time and
# never overwrites. Environment variables (RECOMP_*, config/launch.env in a
# bundle) override both. Reference: the toolkit's docs/runtime/config.md.

[render]
scale = 1                 # internal resolution factor: 1 (stock 640x480), 2, 3, 4
                          # (Metal and Direct3D 11; the software renderer
                          # ignores it)
aniso = 0                 # anisotropic filtering on mipmapped textures: 0 (stock,
                          # off) or 2..16; sharper ground and walls at a distance
                          # (Metal and Direct3D 11)

[display]
aspect = "4:3"            # only 4:3 so far

[present]
filter = "nearest"        # "nearest" (stock), "linear", "integer"
fullscreen = false        # true: borderless fullscreen at start
pacing = "spin"           # "spin" (stock: the game's lowered spin waits hold a
                          # CPU core, as on the Xbox) or "sleep" (they sleep
                          # until the kernel signals instead; the frames are
                          # the same)

# [textures]
# pack = "none"           # a texture pack file; none for this title yet
# font = "on"             # a pack's font-atlas entries, "on" or "off"
# text = "on"             # a pack's baked-text entries, "on" or "off"
